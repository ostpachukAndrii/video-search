[project]
name = "vsearch"
version = "0.1.0"
description = "Семантичний пошук по відео та фото для розслідувань (офлайн, мультимовний)"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }

# M0 навмисно легкий: харнес має бути зеленим ДО того, як у репозиторій
# приїдуть гігабайти ваг. Усе важке живе в extras нижче.
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2,<10",  # pytest-bdd 8.x ламається на pytest 10
    "pytest-bdd>=7.2",
]
ml = [
    "torch>=2.4",
    "transformers>=4.45",
    "pillow>=10.3",
    "opencv-python-headless>=4.10",
]
index = [
    "qdrant-client>=1.11",
]
video = [
    "av>=12.3",
    "scenedetect>=0.6.4",
    "faster-whisper>=1.0",
]
ocr = [
    "pytesseract>=0.3.10",
]
llm = [
    "llama-cpp-python>=0.3",
]
api = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "gradio>=4.40",
]

[project.scripts]
vsearch = "vsearch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vsearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
bdd_features_base_dir = "features"
markers = [
    # Технічні
    "wip: сценарій написаний, реалізації ще немає (backlog) — деселектується типово",
    "needs_models: потребує ваг у models/ (пропускається, якщо їх нема)",
    "slow: довгі прогони, індексація великих наборів",
    # Теги з Gherkin — pytest-bdd перетворює їх на маркери
    "offline: робота без мережі (п.9)",
    "licenses: придатність ліцензій для комерції (п.6)",
    "search: семантичний пошук",
    "binding: звʼязування ознак з обʼєктом",
    "negation: заперечення та атрибути (п.11)",
    "multilingual: мультимовність (п.5)",
    "small_objects: дрібні обʼєкти (п.12)",
    "lexical: точний збіг за текстом — номери, написи, імена",
    "real_photos: якість на реальних знімках із перевіреною розміткою",
    "invariants: властивості, що мусять триматися на будь-якому корпусі",
    "adversarial: запити, що намагаються обдурити систему",
    "notes: коментарі людини до кадрів — зародок розмітки",
    "similar: пошук схожого за позначеним кадром (зворотний звʼязок Rocchio)",
    "categories: категоризація (п.4)",
    "faces: обличчя (п.13)",
    "video: відео (п.8)",
    "performance: швидкість (п.10)",
]
# @wip деселектується типово, щоб CI був зеленим, але backlog лишався видимим:
#     pytest -m wip     — показати, що ще не реалізовано
addopts = "-ra --strict-markers -m 'not wip'"

[tool.ruff]
line-length = 100
target-version = "py311"
